    <g class="eyes" style="transform-origin:200px 150px">
      <ellipse cx="184" cy="150" rx="4.5" ry="6" fill="#effcff"/>
      <ellipse cx="216" cy="150" rx="4.5" ry="6" fill="#effcff"/>
    </g>
    <!-- kacamata: lensa kotak membulat, jembatan, gagang ke telinga -->
    <g fill="#effcff" fill-opacity="0.12" stroke="#effcff" stroke-width="3.5">
      <rect x="166" y="136" width="34" height="26" rx="9"/>
      <rect x="204" y="136" width="34" height="26" rx="9"/>
    </g>
    <path d="M200,146 Q202,142 204,146 M166,143 L156,141 M238,143 L248,141"
          stroke="#effcff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M172,143 L180,140 M210,143 L218,140" stroke="#ffffff"
          stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <!-- senyum -->
    <path d="M190,176 Q200,182 210,176" stroke="#effcff" stroke-width="2.5"
          fill="none" stroke-linecap="round" opacity="0.85"/>
  </g></g>
      <line x1="150" y1="228" x2="136" y2="332" stroke="#2b63c4" stroke-width="26" stroke-linecap="round"/><line x1="136" y1="332" x2="152" y2="428" stroke="#2b63c4" stroke-width="23" stroke-linecap="round"/><line x1="150" y1="228" x2="142" y2="285" stroke="#dff1ff" stroke-width="40" stroke-linecap="round"/><circle cx="152" cy="428" r="15" fill="#2b63c4"/>
      <g class="move"><line x1="250" y1="228" x2="300" y2="286" stroke="#2b63c4" stroke-width="26" stroke-linecap="round"/><line x1="300" y1="286" x2="336" y2="250" stroke="#2b63c4" stroke-width="23" stroke-linecap="round"/><line x1="250" y1="228" x2="278" y2="260" stroke="#dff1ff" stroke-width="40" stroke-linecap="round"/><circle cx="336" cy="250" r="15" fill="#2b63c4"/></g>
    </g>
  </g>
</svg>
